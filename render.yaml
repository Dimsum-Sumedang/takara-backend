services:
  - type: web
    name: takara-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: FALLBACK_ENCRYPTION_KEY
        sync: false
      - key: JWT_ISSUER
        value: takara-api
      - key: JWT_AUDIENCE
        value: takara-web
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_LOGIN_ENABLED
        value: "false"
